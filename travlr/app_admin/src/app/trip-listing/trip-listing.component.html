<div id="background">
  <div id="page">
    <div id="contents">
      <div class="box">
        <div>
          <div class="body">
            <h1>Trips</h1>

            <ul id="sites">
              <app-trip-card
                *ngFor="let trip of trips"
                [trip]="trip"
                (deleteRequested)="deleteTrip($event)">
              </app-trip-card>
            </ul>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
