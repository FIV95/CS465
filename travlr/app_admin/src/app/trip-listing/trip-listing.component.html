<div id="background">
  <div id="page">
    <div id="contents">
      <div class="box">
        <div>
          <div class="body">
            <h1>Trips</h1>

            <ul id="sites">
              <li *ngFor="let trip of trips">
                <img src="assets/images/{{ trip.image }}" alt="{{ trip.name }}">
                <h2>{{ trip.name }}</h2>
                <p>{{ trip.description }}</p>
                <p>
                  <strong>Length:</strong> {{ trip.length }}<br>
                  <strong>Start:</strong> {{ trip.start }}<br>
                  <strong>Resort:</strong> {{ trip.resort }}<br>
                  <strong>Per Person:</strong> ${{ trip.perPerson }}
                </p>
              </li>
            </ul>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
